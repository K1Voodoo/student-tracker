<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>Student Tracker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="updateBanner" class="update-banner hidden">
    <span id="updateText"></span>
    <div class="update-actions">
      <button id="updateAction" class="btn primary small"></button>
      <button id="updateLater" class="btn small">Later</button>
    </div>
  </div>

  <header class="topbar">
    <h1>Student Tracker</h1>
    <div class="topbar-right">
      <span id="studentCount" class="muted"></span>
      <button id="editColumnsBtn" class="btn" title="Add, remove, move and rename columns">▦ Edit columns</button>
      <button id="settingsBtn" class="btn" title="Settings">⚙ Settings</button>
    </div>
  </header>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input id="search" type="search" placeholder="Search students (name, email, country, notes, …)" />
    </div>
    <button id="addStudentBtn" class="btn primary">+ Add student</button>
  </div>

  <main class="table-wrap">
    <table id="grid">
      <thead>
        <!-- filled from the column settings (Edit columns) -->
        <tr id="headRow"><th class="col-name">Name</th></tr>
      </thead>
      <tbody id="gridBody"></tbody>
    </table>
    <div id="emptyState" class="empty hidden"></div>
  </main>

  <!-- Popover for document / report lists -->
  <div id="popover" class="popover hidden"></div>

  <!-- Modal -->
  <div id="modalBackdrop" class="backdrop hidden">
    <div id="modal" class="modal"></div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="renderer.js"></script>
</body>
</html>
